[project]
name = "langgraph-agent"
version = "0.1.0"
description = "Minimal LangGraph chat agent with tool calling"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain-core>=1.5.1",
    "langchain-openai>=1.4.1",
    "langgraph>=1.2.9",
    "python-dotenv>=1.2.2",
]

[project.scripts]
langgraph-agent = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
